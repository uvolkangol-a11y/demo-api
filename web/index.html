<title>Rota Health</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Compare Google-rated dental and hair transplant clinics in Türkiye and book with a 10% deposit.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Onest:wght@400;500;600;700&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: İznik-cobalt hero with a live product collage → search panel overlapping the hero edge → treatment tiles → clinic cards with patterned covers → savings bars → route-style steps → partner band. Booking opens a bottom sheet that ends in a boarding-pass style treatment pass. */
:root {
  --bg: #F4F6FB;
  --surface: #FFFFFF;
  --surface-2: #EEF1F9;
  --ink: #0B1736;
  --muted: #5B6684;
  --line: #DFE4F0;
  --cobalt: #2243D0;
  --cobalt-ink: #FFFFFF;
  --cobalt-soft: #E6EBFD;
  --red: #D63D28;
  --red-ink: #FFFFFF;
  --red-soft: #FCE7E3;
  --gold: #E39A0B;
  --hero-a: #2343D2;
  --hero-b: #0E1F70;
  --on-hero: #FFFFFF;
  --on-hero-muted: #C5CFF8;
  --shadow: 0 22px 48px -24px rgba(14, 31, 112, .45);
  --shadow-sm: 0 8px 24px -14px rgba(14, 31, 112, .35);
  --scrim: rgba(7, 13, 31, .55);
  --display: "Unbounded", "Readex Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --body: "Onest", "Readex Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #070C1C; --surface: #0F172E; --surface-2: #16213F; --ink: #E8ECF8; --muted: #98A3C3; --line: #22305A;
    --cobalt: #8199FF; --cobalt-ink: #08112E; --cobalt-soft: #1A2756; --red: #FF705A; --red-ink: #2A0B05; --red-soft: #3A1A16;
    --gold: #F5B53A; --hero-a: #1A33A8; --hero-b: #060E3A; --on-hero: #FFFFFF; --on-hero-muted: #AFBBEE;
    --shadow: 0 22px 48px -24px rgba(0, 0, 0, .7); --shadow-sm: 0 8px 24px -14px rgba(0, 0, 0, .6); --scrim: rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #070C1C; --surface: #0F172E; --surface-2: #16213F; --ink: #E8ECF8; --muted: #98A3C3; --line: #22305A;
  --cobalt: #8199FF; --cobalt-ink: #08112E; --cobalt-soft: #1A2756; --red: #FF705A; --red-ink: #2A0B05; --red-soft: #3A1A16;
  --gold: #F5B53A; --hero-a: #1A33A8; --hero-b: #060E3A; --on-hero: #FFFFFF; --on-hero-muted: #AFBBEE;
  --shadow: 0 22px 48px -24px rgba(0, 0, 0, .7); --shadow-sm: 0 8px 24px -14px rgba(0, 0, 0, .6); --scrim: rgba(0, 0, 0, .7);
  color-scheme: dark;
}
:lang(ar) { --display: "Readex Pro", system-ui, sans-serif; --body: "Readex Pro", system-ui, sans-serif; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { animation: none !important; transition: none !important; } }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--cobalt); outline-offset: 2px; }
.wrap { max-width: 1160px; margin: 0 auto; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
:lang(ar) .eyebrow { letter-spacing: 0; }

/* ---------- Hero ---------- */
.hero {
  margin-top: calc(-1 * env(safe-area-inset-top, 0px));
  padding-top: env(safe-area-inset-top, 0px);
  background: radial-gradient(120% 90% at 85% 10%, var(--hero-a) 0%, var(--hero-b) 70%);
  color: var(--on-hero); position: relative; overflow: hidden;
}
.ornament { position: absolute; inset-inline-end: -140px; top: -120px; width: 620px; height: 620px; opacity: .16; pointer-events: none; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 18px; position: relative; z-index: 2; }
.brand { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; }
.brand svg { width: 36px; height: 36px; flex: none; }
.brand b { font-family: "Unbounded", system-ui, sans-serif; font-weight: 600; font-size: 17px; letter-spacing: -.01em; }
.lang { position: relative; }
.lang select { appearance: none; -webkit-appearance: none; background: rgba(255,255,255,.12); color: var(--on-hero); border: 1px solid rgba(255,255,255,.22); border-radius: 999px; padding: 8px 32px 8px 14px; font-size: 13px; font-weight: 500; }
[dir="rtl"] .lang select { padding: 8px 14px 8px 32px; }
.lang select option { color: #0B1736; }
.lang::after { content: ""; position: absolute; inset-inline-end: 13px; top: 50%; width: 7px; height: 7px; border-right: 1.6px solid currentColor; border-bottom: 1.6px solid currentColor; transform: translateY(-70%) rotate(45deg); pointer-events: none; }

.hero-grid { position: relative; z-index: 1; display: grid; grid-template-columns: 1.08fr .92fr; gap: 40px; align-items: center; padding-block: 28px 120px; }
.hero-copy { display: grid; gap: 20px; min-width: 0; }
.hero-copy .eyebrow { color: var(--on-hero-muted); display: inline-flex; align-items: center; gap: 10px; }
.hero-copy .eyebrow::before { content: ""; width: 26px; height: 2px; background: var(--red); border-radius: 2px; }
.hero h1 { font-size: clamp(30px, 5vw, 58px); line-height: 1.06; font-weight: 600; letter-spacing: -.025em; }
:lang(ar) .hero h1 { letter-spacing: 0; line-height: 1.25; font-weight: 700; }
.hero h1 em { font-style: normal; color: var(--on-hero); background: linear-gradient(transparent 62%, rgba(214, 61, 40, .85) 62%, rgba(214, 61, 40, .85) 90%, transparent 90%); padding-inline: 2px; }
.hero .sub { color: var(--on-hero-muted); font-size: 17px; max-width: 52ch; }
.stats { display: flex; flex-wrap: wrap; gap: 14px 28px; padding-top: 6px; }
.stat { display: grid; gap: 2px; min-width: 0; }
.stat b { font-family: "Unbounded", "Readex Pro", system-ui, sans-serif; font-size: 22px; font-weight: 600; }
.stat span { font-size: 12px; color: var(--on-hero-muted); max-width: 22ch; line-height: 1.35; }
.src-note { font-size: 11px; color: var(--on-hero-muted); opacity: .8; }

/* Product collage */
.collage { position: relative; height: 430px; min-width: 0; }
.collage > *, .collage > .pass { position: absolute; }
.c-card { width: min(320px, 82%); inset-inline-start: 6%; top: 8px; background: var(--surface); color: var(--ink); border-radius: 22px; box-shadow: var(--shadow); overflow: hidden; transform: rotate(-3deg); animation: float 7s ease-in-out infinite; }
[dir="rtl"] .c-card { transform: rotate(3deg); }
.c-card .cover { height: 132px; }
.c-card .body { padding: 14px 16px 16px; display: grid; gap: 6px; }
.c-card h3 { font-size: 15px; font-weight: 600; }
.c-card .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.c-card .row strong { font-family: "Unbounded", "Readex Pro", sans-serif; font-size: 17px; color: var(--ink); font-weight: 600; }
.c-pass { width: min(300px, 76%); inset-inline-end: 0; bottom: 18px; transform: rotate(4deg); animation: float 8s ease-in-out -2s infinite; }
[dir="rtl"] .c-pass { transform: rotate(-4deg); }
.c-bubble { inset-inline-end: 6%; top: 34px; background: var(--surface); color: var(--ink); border-radius: 16px; padding: 10px 14px; box-shadow: var(--shadow-sm); display: grid; gap: 2px; animation: float 6s ease-in-out -1s infinite; }
.c-bubble b { font-family: "Unbounded", sans-serif; font-weight: 600; font-size: 20px; display: flex; align-items: center; gap: 6px; }
.c-bubble b i { color: var(--gold); font-style: normal; font-size: 16px; }
.c-bubble span { font-size: 11px; color: var(--muted); }
@keyframes float { 0%, 100% { translate: 0 0; } 50% { translate: 0 -8px; } }

/* ---------- Search panel ---------- */
.search { position: relative; z-index: 3; margin-top: -72px; background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); padding: 18px; display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: end; border: 1px solid var(--line); }
.seg { display: grid; gap: 6px; min-width: 0; }
.seg > span, .fld > span { font-size: 12px; font-weight: 600; color: var(--muted); }
.seg-btns { display: flex; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; }
.seg-btns button { border: 0; background: transparent; border-radius: 9px; padding: 10px 14px; font-weight: 600; font-size: 14px; color: var(--muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; }
.seg-btns button svg { width: 17px; height: 17px; }
.seg-btns button[aria-pressed="true"] { background: var(--surface); color: var(--cobalt); box-shadow: 0 2px 8px -4px rgba(14,31,112,.35); }
.fld { display: grid; gap: 6px; min-width: 0; }
.fld select { width: 100%; background: var(--surface-2); border: 0; border-radius: 12px; padding: 13px 14px; font-size: 15px; font-weight: 500; }
.btn { border: 0; border-radius: 12px; background: var(--cobalt); color: var(--cobalt-ink); font-weight: 600; padding: 12px 18px; font-size: 14px; white-space: nowrap; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .12s ease, filter .15s ease, box-shadow .15s ease; }
.btn:hover { filter: brightness(1.07); }
.btn:active { transform: scale(.98); }
.btn.red { background: var(--red); color: var(--red-ink); padding: 14px 22px; font-size: 15px; box-shadow: 0 10px 22px -12px var(--red); }
.btn.ghost { background: transparent; color: var(--cobalt); box-shadow: inset 0 0 0 1.5px var(--cobalt); }
.btn.block { width: 100%; padding: 15px; font-size: 15px; }
.btn svg { width: 18px; height: 18px; }

/* ---------- Sections ---------- */
.sec { padding-block: 64px 0; }
.sec-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.sec-head > div { display: grid; gap: 8px; max-width: 62ch; min-width: 0; }
.sec-head .eyebrow { color: var(--red); }
.sec-head h2 { font-size: clamp(22px, 3.4vw, 34px); font-weight: 600; letter-spacing: -.02em; line-height: 1.15; }
:lang(ar) .sec-head h2 { letter-spacing: 0; line-height: 1.35; }
.sec-head p { color: var(--muted); }

/* Treatment tiles */
.tiles { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
.tile { position: relative; text-align: start; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; align-content: start; min-height: 150px; transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
.tile:not(:disabled):hover { transform: translateY(-3px); box-shadow: var(--shadow-sm); border-color: var(--cobalt); }
.tile .ic { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; background: var(--cobalt-soft); color: var(--cobalt); }
.tile .ic svg { width: 24px; height: 24px; }
.tile b { font-size: 15px; font-weight: 600; line-height: 1.25; }
.tile small { font-size: 12px; color: var(--muted); line-height: 1.4; }
.tile:disabled { cursor: default; background: transparent; border-style: dashed; }
.tile:disabled .ic { background: var(--surface-2); color: var(--muted); }
.tile .soon { position: absolute; top: 12px; inset-inline-end: 12px; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--red); background: var(--red-soft); border-radius: 6px; padding: 3px 7px; }
:lang(ar) .tile .soon { letter-spacing: 0; }
.tile .live { position: absolute; top: 14px; inset-inline-end: 14px; width: 8px; height: 8px; border-radius: 50%; background: #1FB57A; box-shadow: 0 0 0 4px rgba(31,181,122,.18); }

/* Results */
.tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sample-note { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 999px; padding: 6px 12px; }
.sample-note b { color: var(--red); font-weight: 700; }
.sort select { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 500; }
.count { font-size: 13px; color: var(--muted); font-weight: 500; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; display: grid; grid-template-rows: auto 1fr; min-width: 0; transition: transform .18s ease, box-shadow .18s ease; }
.card:hover { transform: translateY(-4px); box-shadow: var(--shadow); }
.cover { position: relative; height: 150px; color: #fff; overflow: hidden; }
.cover::before { content: ""; position: absolute; inset: 0; opacity: .22;
  background:
    radial-gradient(circle at 50% 50%, transparent 13px, #fff 14px, #fff 15px, transparent 16px) 0 0 / 40px 40px,
    radial-gradient(circle at 0 0, transparent 19px, #fff 20px, #fff 21px, transparent 22px) 0 0 / 40px 40px; }
.cover .big-ic { position: absolute; inset-inline-end: 18px; bottom: -14px; width: 104px; height: 104px; opacity: .9; }
.cover .rt { position: absolute; inset-inline-start: 14px; bottom: 14px; background: rgba(255,255,255,.96); color: #0B1736; border-radius: 999px; padding: 6px 12px 6px 10px; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; box-shadow: 0 6px 16px -8px rgba(0,0,0,.4); }
.cover .rt i { color: #E39A0B; font-style: normal; }
.cover .rt .g { color: #5B6684; font-weight: 500; }
.cover .smp { position: absolute; top: 12px; inset-inline-start: 14px; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; background: rgba(0,0,0,.28); backdrop-filter: blur(4px); border-radius: 6px; padding: 3px 8px; }
:lang(ar) .cover .smp { letter-spacing: 0; }
.card .body { padding: 16px 18px 18px; display: grid; gap: 12px; align-content: start; }
.card h3 { font-size: 17px; font-weight: 600; letter-spacing: -.01em; line-height: 1.25; }
:lang(ar) .card h3 { letter-spacing: 0; }
.loc { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
.loc svg { width: 14px; height: 14px; flex: none; }
.revs { font-size: 12px; color: var(--muted); }
.perks { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; padding: 0; margin: 0; }
.perks li { font-size: 12px; background: var(--surface-2); border-radius: 8px; padding: 4px 9px; color: var(--ink); display: inline-flex; align-items: center; gap: 5px; }
.perks li::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--cobalt); }
.langs { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; color: var(--muted); align-items: center; }
.langs span { border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; font-weight: 600; font-size: 11px; letter-spacing: .04em; color: var(--ink); }
.card-foot { display: flex; align-items: end; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); padding-top: 14px; margin-top: 2px; }
.price small { display: block; font-size: 12px; color: var(--muted); }
.price strong { font-family: "Unbounded", "Readex Pro", sans-serif; font-size: 24px; font-weight: 600; letter-spacing: -.02em; }
.empty { padding: 40px 0; color: var(--muted); text-align: center; }

/* Savings */
.cmp { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.cmp-card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 20px; display: grid; gap: 12px; min-width: 0; align-content: start; }
.cmp-top { display: flex; justify-content: space-between; align-items: start; gap: 10px; }
.cmp-top h3 { font-family: var(--body); font-size: 14px; font-weight: 600; color: var(--muted); }
.pct { font-family: "Unbounded", "Readex Pro", sans-serif; font-size: 34px; font-weight: 600; color: var(--cobalt); line-height: 1; letter-spacing: -.03em; direction: ltr; }
.save { font-size: 12px; color: var(--muted); margin-top: -6px; }
.cmp-row { display: grid; grid-template-columns: 7.2em 1fr; gap: 10px; align-items: center; font-size: 12px; }
.cmp-row .c { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmp-row.tr .c { color: var(--ink); font-weight: 700; }
.track { position: relative; height: 26px; background: var(--surface-2); border-radius: 8px; }
.range { position: absolute; top: 5px; bottom: 5px; border-radius: 5px; background: var(--muted); opacity: .35; }
.cmp-row.tr .range { background: var(--cobalt); opacity: 1; }
.rv { position: absolute; top: 50%; transform: translateY(-50%); font-size: 11px; font-weight: 600; white-space: nowrap; color: var(--ink); direction: ltr; }
.fine { font-size: 12px; color: var(--muted); margin-top: 12px; }

/* Route steps */
.route { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; position: relative; counter-reset: s; }
.route::before { content: ""; position: absolute; top: 27px; inset-inline: 28px 28px; border-top: 2px dashed var(--line); }
.route li { position: relative; display: grid; gap: 10px; align-content: start; counter-increment: s; min-width: 0; }
.route .node { width: 56px; height: 56px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; color: var(--cobalt); position: relative; box-shadow: var(--shadow-sm); }
.route .node svg { width: 26px; height: 26px; }
.route .node::after { content: counter(s); position: absolute; top: -8px; inset-inline-end: -8px; width: 22px; height: 22px; border-radius: 50%; background: var(--red); color: var(--red-ink); font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.route h3 { font-size: 18px; font-weight: 600; }
.route p { color: var(--muted); font-size: 14px; max-width: 34ch; }

/* Partner */
.partner { margin-top: 72px; border-radius: 28px; background: radial-gradient(120% 120% at 100% 0%, var(--hero-a), var(--hero-b) 70%); color: var(--on-hero); padding: clamp(24px, 4vw, 44px); display: grid; grid-template-columns: auto 1fr auto; gap: 28px; align-items: center; position: relative; overflow: hidden; }
.partner .ornament { width: 420px; height: 420px; top: -150px; inset-inline-end: -120px; opacity: .14; }
.ten { font-family: "Unbounded", sans-serif; font-weight: 700; font-size: clamp(64px, 10vw, 120px); line-height: .9; letter-spacing: -.05em; position: relative; direction: ltr; }
.ten small { position: absolute; top: -34px; right: -40px; width: 66px; height: 66px; border-radius: 50%; background: var(--red); color: #fff; font-family: var(--body); font-size: 9px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; display: grid; place-items: center; text-align: center; line-height: 1.15; padding: 6px; transform: rotate(14deg); }
.partner h2 { font-size: clamp(20px, 2.8vw, 28px); font-weight: 600; letter-spacing: -.02em; }
.partner p { color: var(--on-hero-muted); margin-top: 8px; max-width: 52ch; }
.partner .btn { background: #fff; color: #0E1F70; position: relative; }

footer { padding-block: 40px 48px; color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; gap: 18px; flex-wrap: wrap; }
footer p { max-width: 70ch; }

/* ---------- Sheet ---------- */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; display: flex; align-items: flex-end; justify-content: center; backdrop-filter: blur(3px); }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: 24px 24px 0 0; padding: 8px max(18px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); animation: up .24s ease-out; }
@keyframes up { from { transform: translateY(28px); opacity: .5; } to { transform: none; opacity: 1; } }
@media (min-width: 720px) { .scrim { align-items: center; } .sheet { border-radius: 24px; max-height: 90vh; padding: 10px 26px 26px; } }
.grab { width: 42px; height: 4px; border-radius: 4px; background: var(--line); margin: 4px auto 12px; }
.sheet-head { display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.sh-cover { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; color: #fff; }
.sh-cover svg { width: 30px; height: 30px; }
.sheet h2 { font-size: 17px; font-weight: 600; line-height: 1.25; }
.sh-meta { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.sh-meta i { color: var(--gold); font-style: normal; }
.sh-meta b { color: var(--ink); }
.x { background: var(--surface-2); border: 0; width: 36px; height: 36px; border-radius: 50%; font-size: 20px; line-height: 1; color: var(--muted); }
.sheet h4 { margin: 20px 0 10px; font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
:lang(ar) .sheet h4 { letter-spacing: 0; text-transform: none; }
.pkgs { display: grid; gap: 8px; }

  }

  function renderTiles() {
    $("tiles").innerHTML = TILES.map(function (x) {
      var inner = '<span class="ic">' + ICONS[x.id] + "</span><b>" + esc(t("cat_" + x.id)) + "</b><small>" + esc(t("d_" + x.id)) + "</small>";
      if (x.soon) return '<button class="tile" type="button" disabled><span class="soon">' + esc(t("soon")) + "</span>" + inner + "</button>";
      return '<button class="tile" type="button" data-tile="' + x.id + '"><span class="live" aria-hidden="true"></span>' + inner + "</button>";
    }).join("");
  }

  function renderGrid() {
    var list = CLINICS.filter(function (c) {
      return (state.cat === "all" || c.type === state.cat) && (state.city === "all" || c.city === state.city);
    });
    list.sort(function (a, b) {
      if (state.sort === "price") return mainPrice(a) - mainPrice(b);
      if (state.sort === "reviews") return b.reviews - a.reviews;
      return b.rating - a.rating || b.reviews - a.reviews;
    });
    $("count").textContent = t("count", { n: fmtNum(list.length) });
    if (!list.length) { $("grid").innerHTML = '<p class="empty">—</p>'; return; }
    $("grid").innerHTML = list.map(function (c) {
      var k = mainKey(c);
      return '<article class="card">' +
        '<div class="cover" style="' + coverBg(c.hue) + '"><span class="smp">' + esc(t("sample")) + '</span><span class="big-ic">' + ICONS[c.type] + "</span>" +
        '<span class="rt num"><i>★</i>' + fmtRating(c.rating) + ' <span class="g">Google</span></span></div>' +
        '<div class="body">' +
          '<div style="display:grid;gap:4px"><h3>' + esc(c.name) + '</h3><p class="loc">' + ICONS.pin + esc(c.district + ", " + CITIES[c.city][state.lang]) + "</p>" +
          '<p class="revs num">' + esc(t("reviews", { n: fmtNum(c.reviews) })) + "</p></div>" +
          '<ul class="perks">' + c.perks.map(function (p) { return "<li>" + esc(t("perk_" + p)) + "</li>"; }).join("") + "</ul>" +
          '<div class="langs">' + c.langs.map(function (l) { return '<span title="' + esc(langName(l)) + '">' + l.toUpperCase() + "</span>"; }).join("") + "</div>" +
          '<div class="card-foot"><div class="price"><small>' + esc(t("from")) + '</small><strong class="num">' + fmtEur(c.pk[k]) + "</strong><small>" + esc(t("pkg_" + k)) + " · " + esc(t("pkg_" + k + "_u")) + "</small></div>" +
          '<button class="btn" type="button" data-open="' + c.id + '">' + esc(t("book")) + "</button></div>" +
        "</div></article>";
    }).join("");
  }

  function renderCompare() {
    var order = ["TR", "DE", "GB", "US"];
    $("cmp").innerHTML = COMPARE.map(function (row) {
      var max = 0, minAbroad = Infinity;
      order.forEach(function (c) { max = Math.max(max, row.rows[c][1]); if (c !== "TR") minAbroad = Math.min(minAbroad, row.rows[c][0]); });
      var pct = Math.round((1 - row.rows.TR[0] / minAbroad) * 100);
      var rows = order.map(function (c) {
        var r = row.rows[c], start = r[0] / max * 100, width = (r[1] - r[0]) / max * 100;
        var pos = start + width > 60 ? "inset-inline-end:calc(" + (100 - start) + "% + 6px)" : "inset-inline-start:calc(" + (start + width) + "% + 6px)";
        return '<div class="cmp-row' + (c === "TR" ? " tr" : "") + '"><span class="c">' + esc(t("c_" + c)) + "</span>" +
          '<div class="track"><span class="range" style="inset-inline-start:' + start + "%;width:" + Math.max(width, 1.5) + '%"></span>' +
          '<span class="rv num" style="' + pos + '">' + fmtEur(r[0]) + "–" + fmtEur(r[1]) + "</span></div></div>";
      }).join("");
      return '<div class="cmp-card"><div class="cmp-top"><h3>' + esc(t(row.key)) + '</h3><span class="pct num">−' + pct + '%</span></div><p class="save">' + esc(t("save")) + "</p>" + rows + "</div>";
    }).join("");
  }

  function renderAll() { applyStatic(); renderCollage(); renderSeg(); renderTiles(); renderGrid(); renderCompare(); if (state.clinic) renderSheet(); }

  /* ---------- Booking sheet ---------- */
  function estimateHtml(pkg) {
    var c = state.clinic, price = c.pk[pkg], dep = Math.round(price * DEPOSIT_RATE);
    return "<div><span>" + esc(t("est")) + '</span><b class="num">' + fmtEur(price) + "</b></div>" +
      '<div class="dep"><span>' + esc(t("deposit")) + '</span><span class="num">' + fmtEur(dep) + "</span></div>" +
      '<div class="tot"><span>' + esc(t("atclinic")) + '</span><span class="num">' + fmtEur(price - dep) + "</span></div>";
  }
  function renderSheet() {
    var c = state.clinic;
    $("sh-cover").setAttribute("style", coverBg(c.hue));
    $("sh-cover").innerHTML = ICONS[c.type];
    $("sh-name").textContent = c.name;
    $("sh-meta").innerHTML = "<i>★</i><b class=\"num\">" + fmtRating(c.rating) + "</b><span class=\"num\">" + esc(t("reviews", { n: fmtNum(c.reviews) })) + "</span><span>· " + esc(c.district + ", " + CITIES[c.city][state.lang]) + "</span>";
    $("sh-pkgs").innerHTML = Object.keys(c.pk).map(function (k) {
      return '<label class="pkg"><input type="radio" name="pkg" value="' + k + '"' + (k === state.pkg ? " checked" : "") + ">" +
        "<span><b>" + esc(t("pkg_" + k)) + "</b><small>" + esc(t("pkg_" + k + "_u")) + '</small></span><span class="p num">' + fmtEur(c.pk[k]) + "</span></label>";
    }).join("");
    $("b-est").innerHTML = estimateHtml(state.pkg);
    if (!$("done").hidden && booking) renderDone();
  }

  var lastFocus = null, booking = null;
  function openSheet(id) {
    state.clinic = CLINICS.filter(function (c) { return c.id === id; })[0];
    state.pkg = mainKey(state.clinic);
    booking = null;
    $("book").hidden = false; $("done").hidden = true; $("b-err").hidden = true;
    renderSheet();
    lastFocus = document.activeElement;
    $("scrim").hidden = false;
    document.body.style.overflow = "hidden";
    $("sheet").scrollTop = 0;
    $("sh-close").focus();
  }
  function closeSheet() {
    $("scrim").hidden = true;
    document.body.style.overflow = "";
    state.clinic = null;
    if (lastFocus) lastFocus.focus();
  }
  function makeRef() {
    var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", s = "";
    for (var i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
    return s;
  }
  function requestText() {
    var c = state.clinic, price = c.pk[booking.pkg], dep = Math.round(price * DEPOSIT_RATE);
    return [
      t("wa_head") + " · " + booking.ref,
      "Clinic: " + c.name + " (" + c.district + ", " + CITIES[c.city].en + ")",
      "Package: " + T.en["pkg_" + booking.pkg] + " – " + T.en["pkg_" + booking.pkg + "_u"] + " – €" + price,
      "Deposit (10%): €" + dep + " · At clinic: €" + (price - dep),
      "Arrival: " + booking.date,
      "Name: " + booking.name,
      "Country: " + booking.countryCode,
      "WhatsApp: " + booking.phone,
      "Language: " + LANG_NAMES[state.lang],
      booking.notes ? "Notes: " + booking.notes : ""
    ].filter(Boolean).join("\n");
  }
  function renderDone() {
    var c = state.clinic;
    $("d-pass").innerHTML =
      '<div class="pass-top"><span>' + esc(t("pass_title")) + "</span><b>Rota Health</b></div>" +
      '<div class="pass-route"><div><div class="code">' + esc(booking.countryCode) + '</div><div class="lbl">' + esc(countryName(booking.countryCode)) + "</div></div>" +
        '<div class="fly">' + ICONS.plane + '</div><div class="r"><div class="code">' + AIRPORT[c.city] + '</div><div class="lbl">' + esc(CITIES[c.city][state.lang]) + "</div></div></div>" +
      '<div class="pass-grid">' +
        "<div><small>" + esc(t("pass_patient")) + "</small><b>" + esc(booking.name) + "</b></div>" +
        "<div><small>" + esc(t("pass_arrival")) + '</small><b class="num">' + esc(fmtDate(booking.date)) + "</b></div>" +
        "<div><small>" + esc(t("pass_clinic")) + "</small><b>" + esc(c.name) + "</b></div>" +
        "<div><small>" + esc(t("pass_pkg")) + "</small><b>" + esc(t("pkg_" + booking.pkg)) + "</b></div>" +
      "</div>" +
      '<div class="perf"></div>' +
      '<div class="pass-foot"><div><small class="small-muted">' + esc(t("pass_ref")) + '</small><div class="ref">' + esc(booking.ref) + '</div><span class="status">' + esc(t("pass_status")) + "</span></div>" + barcode() + "</div>";
    $("d-est").innerHTML = estimateHtml(booking.pkg);
    var text = requestText();
    $("d-text").textContent = text;
    $("d-wa").href = waLink(text);
  }

  function scrollToResults() { var el = $("results"); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }

  /* ---------- Events ---------- */
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-cat]");
    if (b) { state.cat = b.getAttribute("data-cat"); renderSeg(); renderGrid(); return; }
    var tl = e.target.closest("[data-tile]");
    if (tl) { state.cat = tl.getAttribute("data-tile"); renderSeg(); renderGrid(); scrollToResults(); return; }
    var o = e.target.closest("[data-open]");
    if (o) { openSheet(o.getAttribute("data-open")); return; }
  });
  $("search").addEventListener("submit", function (e) { e.preventDefault(); renderGrid(); scrollToResults(); });
  $("f-city").addEventListener("change", function () { state.city = this.value; renderGrid(); });
  $("sort").addEventListener("change", function () { state.sort = this.value; renderGrid(); });
  $("lang").addEventListener("change", function () {
    state.lang = this.value; store("rh-lang", state.lang);
    if (location.hash.replace("#", "") !== state.lang) location.hash = state.lang;
    renderAll();
  });
  window.addEventListener("hashchange", function () {
    var h = location.hash.replace("#", "").toLowerCase();
    if (LANGS.indexOf(h) > -1 && h !== state.lang) { state.lang = h; store("rh-lang", h); renderAll(); }
  });
  $("sh-pkgs").addEventListener("change", function (e) { if (e.target.name === "pkg") { state.pkg = e.target.value; $("b-est").innerHTML = estimateHtml(state.pkg); } });
  $("sh-close").addEventListener("click", closeSheet);
  $("d-close").addEventListener("click", closeSheet);
  $("scrim").addEventListener("click", function (e) { if (e.target === this) closeSheet(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("scrim").hidden) closeSheet(); });

  $("book").addEventListener("submit", function (e) {
    e.preventDefault();
    var name = $("b-name").value.trim(), phone = $("b-phone").value.trim(), date = $("b-date").value;
    if (!name || phone.replace(/\D/g, "").length < 7 || !date || !$("b-consent").checked) { $("b-err").hidden = false; return; }
    $("b-err").hidden = true;
    booking = { ref: makeRef(), pkg: state.pkg, name: name, phone: phone, date: date, countryCode: $("b-country").value, notes: $("b-notes").value.trim() };
    renderDone();
    $("book").hidden = true; $("done").hidden = false;
    $("sheet").scrollTop = 0;
  });

  $("d-copy").addEventListener("click", function () {
    var btn = this, text = $("d-text").textContent;
    function ok() { btn.textContent = t("copied"); setTimeout(function () { btn.textContent = t("copy"); }, 1600); }
    function fallback() { var d = btn.parentNode.parentNode.querySelector("details"); if (d) d.open = true; var r = document.createRange(); r.selectNodeContents($("d-text")); var s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    try { navigator.clipboard.writeText(text).then(ok, fallback); } catch (err) { fallback(); }
  });

  var d1 = new Date(); d1.setDate(d1.getDate() + 7);
  $("b-date").min = d1.toISOString().slice(0, 10);
  var d2 = new Date(); d2.setDate(d2.getDate() + 30);
  $("b-date").value = d2.toISOString().slice(0, 10);

  drawOrnament($("ornament"));
  drawOrnament($("ornament2"));
  state.lang = detectLang();
  renderAll();
})();
</script>
