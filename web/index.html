<style>
/* Layout: app-style single column — sticky header, deep-teal hero with filters, clinic card grid, price comparison, steps, partner band; booking happens in a bottom sheet (centered modal on desktop). */
:root {

    --coral: #EE8A72; --coral-soft: #3A2019; --hero: #081B1D; --hero-ink: #ECF5F3;

}
:root[data-theme="dark"] {
  --bg: #0B1517; --surface: #122123; --ink: #E5EFED; --muted: #93A8A9; --line: #233739;
  --accent: #3FC1BA; --accent-ink: #062224; --accent-soft: #143A3A; --gold: #E6B23E;
  --coral: #EE8A72; --coral-soft: #3A2019; --hero: #081B1D; --hero-ink: #ECF5F3;
  --hero-muted: #93B2AF; --hero-field: #123134; --scrim: rgba(0, 0, 0, .65);

}

* { box-sizing: border-box; }

.hero { background: var(--hero); color: var(--hero-ink); position: relative; overflow: hidden; }
.hero::after {

  -webkit-mask-image: linear-gradient(to left, #000 30%, transparent);
          mask-image: linear-gradient(to left, #000 30%, transparent);

.hero .wrap { position: relative; z-index: 1; padding-block: 36px 30px; display: grid; gap: 22px; }

.notice { margin-top: 18px; display: flex; gap: 10px; align-items: flex-start; background: var(--coral-soft); color: var(--ink); border-radius: 10px; padding: 10px 14px; font-size: 13px; }

.cats { display: flex; gap: 8px; overflow-x: auto; padding-block: 16px 4px; scrollbar-width: none; }
.cats::-webkit-scrollbar { display: none; }
.cat { flex: none; display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 500; white-space: nowrap; }

.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px 12px; flex-wrap: wrap; }

.sort { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.sort select { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px; color: var(--ink); }

/* Clinic cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; padding-bottom: 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.card-top { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: start; }
.mono { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-family: "Manrope", sans-serif; font-weight: 800; font-size: 15px; background: var(--accent-soft); color: var(--accent); }
.mono svg { width: 24px; height: 24px; }
.card h3 { font-size: 16px; font-weight: 700; line-height: 1.25; }
.loc { font-size: 13px; color: var(--muted); }
.tag-sample { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--coral); border: 1px solid currentColor; border-radius: 6px; padding: 2px 6px; white-space: nowrap; }

.rating { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }

.src { font-size: 11px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
.perks { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; padding: 0; margin: 0; }

.speaks { font-size: 12px; color: var(--muted); }
.card-foot { display: flex; align-items: end; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
.price small { display: block; font-size: 12px; color: var(--muted); }

.btn { border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-weight: 600; padding: 11px 16px; font-size: 14px; white-space: nowrap; transition: transform .12s ease, filter .12s ease; }

/* Sections */
section.block { padding-block: 40px 8px; }
.sec-head { display: grid; gap: 6px; margin-bottom: 18px; }
.sec-head h2 { font-size: clamp(22px, 4vw, 30px); font-weight: 800; }

/* Price comparison */
.cmp { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.cmp-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 10px; min-width: 0; }

.cmp-row { display: grid; grid-template-columns: 7.5em 1fr; gap: 10px; align-items: center; font-size: 12px; }
.cmp-row .c { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.track { position: relative; height: 26px; background: var(--bg); border-radius: 6px; }

.rv { position: absolute; top: 50%; transform: translateY(-50%); font-size: 11px; font-weight: 600; white-space: nowrap; color: var(--ink); direction: ltr; }
.save { font-size: 13px; color: var(--accent); font-weight: 600; }

.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; list-style: none; padding: 0; margin: 0; counter-reset: s; }

.steps h3 { font-size: 16px; font-weight: 700; padding-top: 5px; }

/* Partner band */
.partner { margin-block: 40px 0; background: var(--accent-soft); border-radius: 18px; padding: 24px; display: flex; gap: 18px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.partner > div { display: grid; gap: 6px; max-width: 60ch; min-width: 0; }

footer { padding-block: 32px 40px; color: var(--muted); font-size: 12px; display: grid; gap: 6px; }

.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 8px max(18px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); animation: up .22s ease-out; }

@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } .btn { transition: none; } }

.form { display: grid; gap: 12px; }
.f { display: grid; gap: 5px; min-width: 0; }
.f label { font-size: 13px; font-weight: 500; }
.f input, .f select, .f textarea { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 11px 12px; font-size: 15px; }

.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

      order.forEach(function (c) { max = Math.max(max, row.rows[c][1]); });
      var maxAbroad = 0; order.slice(1).forEach(function (c) { maxAbroad = Math.max(maxAbroad, row.rows[c][0]); });
      var pct = Math.round((1 - row.rows.TR[0] / maxAbroad) * 100);
      var rows = order.map(function (c) {
        var r = row.rows[c];
        var start = r[0] / max * 100, width = (r[1] - r[0]) / max * 100;
        var labelPos = start + width > 62 ? "inset-inline-end:calc(" + (100 - start) + "% + 6px)" : "inset-inline-start:calc(" + (start + width) + "% + 6px)";
        return '<div class="cmp-row' + (c === "TR" ? " tr" : "") + '"><span class="c">' + esc(t("c_" + c)) + '</span>' +
          '<div class="track"><span class="range" style="inset-inline-start:' + start + "%;width:" + Math.max(width, 1.5) + '%"></span>' +
          '<span class="rv num" style="' + labelPos + '">' + fmtEur(r[0]) + "–" + fmtEur(r[1]) + "</span></div></div>";
      }).join("");
      return '<div class="cmp-card"><h3>' + esc(t(row.key)) + "</h3>" + rows + '<p class="save">' + esc(t("save", { p: pct })) + "</p></div>";
    }).join("");
  }

  function renderAll() { applyStatic(); renderCats(); renderGrid(); renderCompare(); if (state.clinic) renderSheet(); }

  /* ---------- Booking sheet ---------- */
  function renderEstimate(target) {
    var c = state.clinic, price = c.pk[state.pkg], dep = Math.round(price * DEPOSIT_RATE);
    target.innerHTML =
      "<div><span>" + esc(t("est")) + " · " + esc(t("pkg_" + state.pkg)) + '</span><b class="num">' + fmtEur(price) + "</b></div>" +
      '<div class="dep"><span>' + esc(t("deposit")) + '</span><span class="num">' + fmtEur(dep) + "</span></div>" +
      '<div class="tot"><span>' + esc(t("atclinic")) + '</span><span class="num">' + fmtEur(price - dep) + "</span></div>";
  }

  function renderSheet() {
    var c = state.clinic;
    $("sh-mono").innerHTML = ICONS[c.type];
    $("sh-name").textContent = c.name;
    $("sh-rating").innerHTML = '<span class="score num">' + fmtRating(c.rating) + "</span>" + stars(c.rating) +
      '<span class="num">' + esc(t("reviews", { n: fmtNum(c.reviews) })) + "</span>";
    $("sh-pkgs").innerHTML = Object.keys(c.pk).map(function (k) {
      return '<label class="pkg"><input type="radio" name="pkg" value="' + k + '"' + (k === state.pkg ? " checked" : "") + ">" +
        "<span><b>" + esc(t("pkg_" + k)) + "</b><small>" + esc(t("pkg_" + k + "_u")) + '</small></span><span class="p num">' + fmtEur(c.pk[k]) + "</span></label>";
    }).join("");
    renderEstimate($("b-est"));
    if (!$("done").hidden) renderDone();
  }

  var lastFocus = null;
  function openSheet(id) {
    state.clinic = CLINICS.filter(function (c) { return c.id === id; })[0];
    state.pkg = mainKey(state.clinic);
    $("book").hidden = false; $("done").hidden = true; $("b-err").hidden = true;
    renderSheet();
    lastFocus = document.activeElement;
    $("scrim").hidden = false;
    document.body.style.overflow = "hidden";
    $("sh-close").focus();
  }
  function closeSheet() {
    $("scrim").hidden = true;
    document.body.style.overflow = "";
    state.clinic = null;
    if (lastFocus) lastFocus.focus();
  }

  var booking = null;
  function makeRef() {
    var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", s = "RH-";
    for (var i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
    return s;
  }
  function requestText() {
    var c = state.clinic, price = c.pk[booking.pkg], dep = Math.round(price * DEPOSIT_RATE);
    return [
      t("wa_head") + " · " + booking.ref,
      "Clinic: " + c.name + " (" + c.district + ", " + CITIES[c.city].en + ")",
      "Package: " + T.en["pkg_" + booking.pkg] + " – " + T.en["pkg_" + booking.pkg + "_u"] + " – €" + price,
      "Deposit (10%): €" + dep + " · At clinic: €" + (price - dep),
      "Arrival: " + booking.date,
      "Name: " + booking.name,
      "Country: " + booking.country,
      "WhatsApp: " + booking.phone,
      "Language: " + LANG_NAMES[state.lang],
      booking.notes ? "Notes: " + booking.notes : ""
    ].filter(Boolean).join("\n");
  }
  function renderDone() {
    $("d-ref").textContent = booking.ref;
    var saved = state.pkg; state.pkg = booking.pkg; renderEstimate($("d-est")); state.pkg = saved;
    var text = requestText();
    $("d-text").textContent = text;
    $("d-wa").href = waLink(text);
  }

  /* ---------- Events ---------- */
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-cat]");
    if (b) { state.cat = b.getAttribute("data-cat"); $("f-cat").value = state.cat; renderCats(); renderGrid(); return; }
    var o = e.target.closest("[data-open]");
    if (o) { openSheet(o.getAttribute("data-open")); return; }
  });
  $("f-cat").addEventListener("change", function () { state.cat = this.value; renderCats(); renderGrid(); });
  $("f-city").addEventListener("change", function () { state.city = this.value; renderGrid(); });
  $("sort").addEventListener("change", function () { state.sort = this.value; renderGrid(); });
  $("lang").addEventListener("change", function () {
    state.lang = this.value; store("rh-lang", state.lang);
    if (location.hash.replace("#", "") !== state.lang) location.hash = state.lang;
    renderAll();
  });
  window.addEventListener("hashchange", function () {
    var h = location.hash.replace("#", "").toLowerCase();
    if (LANGS.indexOf(h) > -1 && h !== state.lang) { state.lang = h; store("rh-lang", h); renderAll(); }
  });
  $("sh-pkgs").addEventListener("change", function (e) { if (e.target.name === "pkg") { state.pkg = e.target.value; renderEstimate($("b-est")); } });
  $("sh-close").addEventListener("click", closeSheet);
  $("d-close").addEventListener("click", closeSheet);
  $("scrim").addEventListener("click", function (e) { if (e.target === this) closeSheet(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("scrim").hidden) closeSheet(); });

  $("book").addEventListener("submit", function (e) {
    e.preventDefault();
    var name = $("b-name").value.trim(), phone = $("b-phone").value.trim(), date = $("b-date").value;
    if (!name || phone.replace(/\D/g, "").length < 7 || !date || !$("b-consent").checked) { $("b-err").hidden = false; return; }
    $("b-err").hidden = true;
    booking = { ref: makeRef(), pkg: state.pkg, name: name, phone: phone, date: date, country: countryName($("b-country").value) + " (" + $("b-country").value + ")", notes: $("b-notes").value.trim() };
    renderDone();
    $("book").hidden = true; $("done").hidden = false;
    $("sheet").scrollTop = 0;
  });

  $("d-copy").addEventListener("click", function () {
    var btn = this, text = $("d-text").textContent;
    function ok() { btn.textContent = t("copied"); setTimeout(function () { btn.textContent = t("copy"); }, 1600); }
    function fallback() { var r = document.createRange(); r.selectNodeContents($("d-text")); var s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    try { navigator.clipboard.writeText(text).then(ok, fallback); } catch (err) { fallback(); }
  });

  // Earliest arrival: one week from today.
  var d = new Date(); d.setDate(d.getDate() + 7);
  var iso = d.toISOString().slice(0, 10);
  $("b-date").min = iso;
  var d2 = new Date(); d2.setDate(d2.getDate() + 30);
  $("b-date").value = d2.toISOString().slice(0, 10);

  state.lang = detectLang();
  renderAll();
})();
</script>
