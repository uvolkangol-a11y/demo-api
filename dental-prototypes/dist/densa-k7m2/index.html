<!doctype html>
<html lang="tr" dir="ltr" data-theme="modern">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Densa Ağız ve Diş Sağlığı | Online Randevu</title>
<meta name="description" content="Densa Ağız ve Diş Sağlığı Polikliniği – Bağcılar Mahmutbey. Online randevu ve yurt dışından gelen hastalar için ücretsiz online ön değerlendirme.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#0E7C86;
  --accent:#F2A65A;
  --brand-dark:color-mix(in oklab,var(--brand) 70%,#000);
  --brand-soft:color-mix(in oklab,var(--brand) 10%,#fff);
  --brand-softer:color-mix(in oklab,var(--brand) 5%,#fff);
  --ink:#14202b;--muted:#5b6b7a;--line:#e4e9ee;--bg:#fbfcfd;--card:#fff;
  --radius:20px;--shadow:0 10px 40px -12px rgba(20,32,43,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased}
html[lang=ar] body{font-family:"Noto Sans Arabic","Plus Jakarta Sans",sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
svg{display:block}

/* demo bar */
.demo-bar{background:#14202b;color:#cfd8e0;font-size:12.5px;text-align:center;padding:7px 16px}
.demo-bar b{color:#fff}

/* nav */
header.nav{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;justify-content:space-between;height:70px;gap:16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.02em}
.logo-mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand-dark));display:grid;place-items:center;color:#fff}
.logo small{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.02em;margin-top:-4px}
.menu{display:flex;gap:26px;font-weight:600;font-size:14.5px;color:var(--muted)}
.menu a:hover{color:var(--brand)}
.menu .nav-intl{color:var(--brand)}
.nav-right{display:flex;align-items:center;gap:10px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:#fff}
.lang button{font-size:12px;font-weight:700;padding:5px 9px;border-radius:999px;color:var(--muted)}
.lang button.on{background:var(--brand);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;border-radius:999px;padding:13px 22px;font-size:15px;transition:transform .15s,box-shadow .15s,background .15s}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--brand);color:#fff;box-shadow:0 8px 24px -8px var(--brand)}
.btn-primary:hover{background:var(--brand-dark)}
.btn-ghost{background:#fff;border:1px solid var(--line)}
.btn-accent{background:var(--accent);color:#1b1b1b}
.btn-dark{background:#14202b;color:#fff}
.istrip{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.istrip button{background:#ffffffb3;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.istrip button:hover{border-color:var(--brand);color:var(--brand)}
.stays{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:8px}
.stay{background:#ffffff0d;border:1px solid #ffffff1a;border-radius:18px;padding:18px}
.stay small{display:block;font-size:12px;color:#93a3b1}
.stay b{display:block;font-size:22px;color:var(--accent);margin:6px 0 2px;letter-spacing:-.02em}
.stay span{font-size:14.5px;font-weight:700;color:#fff}
.stays-head{margin:44px 0 14px;font-size:18px;color:#fff}
.btn-sm{padding:9px 16px;font-size:14px}
.burger{display:none;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);place-items:center}

/* hero */
.hero{position:relative;overflow:hidden;background:
  radial-gradient(900px 500px at 85% -10%,color-mix(in oklab,var(--accent) 35%,transparent),transparent 60%),
  radial-gradient(800px 600px at -10% 110%,color-mix(in oklab,var(--brand) 22%,transparent),transparent 60%),
  linear-gradient(180deg,var(--brand-softer),#fff)}
.hero-in{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center;padding:72px 20px 84px}
.pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 8px;font-size:13px;font-weight:600;color:var(--muted)}
.pill i{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 4px #22c55e22;display:inline-block;margin-inline-start:6px}
h1{font-size:clamp(34px,5.2vw,58px);line-height:1.06;letter-spacing:-.035em;font-weight:800;margin:20px 0 18px}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--brand),color-mix(in oklab,var(--brand) 55%,var(--accent)));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:18px;color:var(--muted);max-width:540px}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.facts{display:flex;flex-wrap:wrap;gap:28px;margin-top:40px}
.fact b{display:block;font-size:22px;letter-spacing:-.02em}
.fact span{font-size:13px;color:var(--muted)}
.hero-card{background:#fff;border-radius:28px;box-shadow:var(--shadow);padding:26px;position:relative}
.hero-card h3{font-size:17px;margin-bottom:4px}
.hero-card p.s{font-size:13.5px;color:var(--muted);margin-bottom:18px}
.qslots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 18px}
.qslots button{border:1px solid var(--line);border-radius:12px;padding:10px 0;font-weight:700;font-size:14px}
.qslots button:hover,.qslots button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-dark)}
.qday{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px;padding:12px 14px;background:var(--brand-softer);border-radius:14px}
.float-tag{position:absolute;inset-inline-end:22px;top:-22px;background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;display:flex;gap:10px;align-items:center;font-size:13px;font-weight:600}
.float-tag .ic{width:34px;height:34px;border-radius:10px;background:#22c55e1a;color:#16a34a;display:grid;place-items:center}
.deco-tooth{position:absolute;inset-inline-end:-60px;top:40px;opacity:.07;color:var(--brand);width:420px;pointer-events:none}

/* sections */
section{padding:88px 0}
.eyebrow{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--brand)}
html[lang=ar] .eyebrow{letter-spacing:0}
h2{font-size:clamp(28px,3.6vw,40px);letter-spacing:-.03em;line-height:1.15;margin:10px 0 14px}
.sub{color:var(--muted);max-width:620px;font-size:16.5px}
.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:40px;flex-wrap:wrap}

.grid-t{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px;transition:border-color .2s,box-shadow .2s,transform .2s;display:flex;flex-direction:column}
.tcard:hover{border-color:color-mix(in oklab,var(--brand) 40%,var(--line));box-shadow:var(--shadow);transform:translateY(-3px)}
.tic{width:52px;height:52px;border-radius:16px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin-bottom:18px}
.tcard h3{font-size:18px;margin-bottom:6px}
.tcard p{color:var(--muted);font-size:14.5px;flex:1}
.tcard .lnk{margin-top:16px;font-weight:700;font-size:14px;color:var(--brand);display:inline-flex;gap:6px;align-items:center}

/* why */
.why{background:#fff;border-block:1px solid var(--line)}
.why-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.why-item{padding:22px;border-radius:var(--radius);background:var(--brand-softer)}
.why-item .tic{background:#fff}
.why-item h4{font-size:16px;margin-bottom:4px}
.why-item p{font-size:14px;color:var(--muted)}

/* booking */
.book{display:grid;grid-template-columns:.85fr 1.15fr;gap:40px;align-items:start}
.book-side ul{list-style:none;margin-top:22px;display:grid;gap:14px}
.book-side li{display:flex;gap:12px;align-items:flex-start;font-size:15px}
.book-side li .ck{flex:none;width:24px;height:24px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;margin-top:1px}
.panel{background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);overflow:hidden}
.steps{display:flex;border-bottom:1px solid var(--line)}
.steps div{flex:1;padding:16px 10px;text-align:center;font-size:13px;font-weight:700;color:var(--muted);position:relative}
.steps div span{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;font-size:11.5px;margin-inline-end:6px}
.steps div.on{color:var(--brand)}
.steps div.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--brand)}
.steps div.done{color:var(--ink)}
.pbody{padding:26px}
.lbl{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 10px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:9px 15px;font-size:14px;font-weight:600;background:#fff}
.chip:hover{border-color:color-mix(in oklab,var(--brand) 45%,var(--line))}
.chip.on{border-color:var(--brand);background:var(--brand);color:#fff}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
.day{flex:none;width:68px;border:1.5px solid var(--line);border-radius:16px;padding:10px 0;text-align:center;background:#fff}
.day small{display:block;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase}
.day b{display:block;font-size:20px;line-height:1.2}
.day em{font-style:normal;font-size:11px;color:var(--muted)}
.day.on{border-color:var(--brand);background:var(--brand);color:#fff}
.day.on small,.day.on em{color:#ffffffcc}
.day:disabled{opacity:.38;cursor:not-allowed;background:#f4f6f8}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.slot{border:1.5px solid var(--line);border-radius:12px;padding:9px 0;font-weight:700;font-size:14px;background:#fff}
.slot:hover:not(:disabled){border-color:var(--brand)}
.slot.on{background:var(--brand);border-color:var(--brand);color:#fff}
.slot:disabled{text-decoration:line-through;color:#a9b4be;background:#f4f6f8;cursor:not-allowed}
.field{margin-bottom:14px}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font-size:15px;background:#fff;outline:none;transition:border-color .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);margin:6px 0 4px}
.consent input{margin-top:3px;accent-color:var(--brand);width:16px;height:16px;flex:none}
.consent a{color:var(--brand);font-weight:600;text-decoration:underline}
.pfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 26px;border-top:1px solid var(--line);background:var(--brand-softer)}
.summary{font-size:13.5px;color:var(--muted)}
.summary b{color:var(--ink)}
.err{color:#c2410c;font-size:13px;font-weight:600;min-height:18px;margin-top:6px}
.success{text-align:center;padding:16px 6px}
.success .big{width:72px;height:72px;border-radius:50%;background:#22c55e1a;color:#16a34a;display:grid;place-items:center;margin:0 auto 16px}
.success h3{font-size:22px;margin-bottom:8px}
.success p{color:var(--muted);margin-bottom:18px}
.rcpt{background:var(--brand-softer);border-radius:16px;padding:16px;text-align:start;font-size:14.5px;display:grid;gap:6px;margin-bottom:18px}
.rcpt div{display:flex;justify-content:space-between;gap:12px}
.rcpt span{color:var(--muted)}
.rcpt b,#phones,table.bk td{unicode-bidi:plaintext}

/* international */
.intl{background:linear-gradient(160deg,#0f1b26,color-mix(in oklab,var(--brand) 45%,#0f1b26));color:#e8eef3;position:relative;overflow:hidden}
.intl .eyebrow{color:var(--accent)}
.intl .sub{color:#b7c4cf}
.intl-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:44px;align-items:start}
.flow{display:grid;gap:12px;margin-top:28px}
.flow-item{display:flex;gap:16px;background:#ffffff0d;border:1px solid #ffffff1a;border-radius:18px;padding:18px}
.flow-item .n{flex:none;width:38px;height:38px;border-radius:12px;background:var(--accent);color:#1b1b1b;font-weight:800;display:grid;place-items:center}
.flow-item h4{font-size:16px;margin-bottom:2px;color:#fff}
.flow-item p{font-size:14px;color:#b7c4cf}
.langs{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.langs span{background:#ffffff14;border:1px solid #ffffff22;border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600}
.intl .panel{color:var(--ink)}
.intl .panel h3{font-size:19px;margin-bottom:4px}
.intl .note{font-size:12px;color:#93a3b1;margin-top:14px}

/* contact */
.contact-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:24px}
.cinfo{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:28px;display:grid;gap:20px;align-content:start}
.crow{display:flex;gap:14px}
.crow .tic{margin:0;width:44px;height:44px;border-radius:14px;flex:none}
.crow small{display:block;font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
html[lang=ar] .crow small{letter-spacing:0}
.crow b{font-size:15.5px;font-weight:600}
.hours{width:100%;font-size:14.5px;border-collapse:collapse}
.hours td{padding:6px 0;border-bottom:1px dashed var(--line)}
.hours td:last-child{text-align:end;font-weight:700}
.hours .closed{color:#c2410c}
.map{border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);min-height:420px;background:#e9eef2}
.map iframe{width:100%;height:100%;min-height:420px;border:0;display:block}

footer{background:#0f1b26;color:#93a3b1;font-size:13.5px;padding:40px 0 30px}
.foot{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}
footer a{color:#cfd8e0}
footer a:hover{color:#fff}
.legal{font-size:12px;margin-top:18px;color:#6d7f8e}

/* float */
.fab{position:fixed;inset-inline-end:20px;bottom:20px;z-index:50;width:60px;height:60px;border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center;box-shadow:0 12px 30px -8px #25D366aa}
.fab.call{background:var(--brand);box-shadow:0 12px 30px -8px var(--brand)}
.mbar{display:none}

/* modal */
.modal{position:fixed;inset:0;background:#0f1b26b3;z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:24px;max-width:860px;width:100%;max-height:86vh;overflow:auto;padding:26px}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px}
.mhead h3{font-size:20px}
table.bk{width:100%;border-collapse:collapse;font-size:14px}
table.bk th{text-align:start;font-size:12px;text-transform:uppercase;color:var(--muted);padding:8px;border-bottom:1px solid var(--line)}
table.bk td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:#fef3c7;color:#92400e;white-space:nowrap}
.badge.ok{background:#dcfce7;color:#166534}
.empty{color:var(--muted);text-align:center;padding:30px}
.kvkk p{color:var(--muted);font-size:14px;margin-bottom:10px}

@media (max-width:980px){
  .menu{display:none}
  .burger{display:grid}
  .menu.open{display:flex;flex-direction:column;position:absolute;top:70px;left:0;right:0;background:#fff;padding:18px 20px;border-bottom:1px solid var(--line);gap:16px}
  .hero-in,.book,.intl-grid,.contact-grid{grid-template-columns:1fr}
  .hero-in{padding:48px 20px 60px;gap:36px}
  .grid-t{grid-template-columns:1fr 1fr}
  .why-grid{grid-template-columns:1fr 1fr}
  .stays{grid-template-columns:1fr 1fr}
  .float-tag{display:none}
  .nav-right .btn{display:none}
}
@media (max-width:620px){
  section{padding:64px 0}
  .grid-t,.why-grid,.row2{grid-template-columns:1fr}
  .wrap{padding:0 16px}
  .hero-in{padding:40px 16px 52px}
  .lang button{padding:5px 7px}
  .logo small{display:none}
  .steps div{font-size:0}
  .steps div span{font-size:11.5px;margin:0}
  .pbody{padding:20px}
  .pfoot{padding:16px 20px;flex-direction:column;align-items:stretch}
  .pfoot .btn{width:100%}
  .fab{display:none}
  .mbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:50;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
  .mbar .btn{padding:12px 10px;font-size:14px}
  footer{padding-bottom:90px}
}

/* ---------- theme switch (demo only) ---------- */
.theme-switch{background:#14202b;color:#93a3b1;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;padding:0 12px 9px;font-size:12.5px;font-family:system-ui,sans-serif}
.theme-switch a{padding:4px 11px;border-radius:999px;border:1px solid #ffffff2e;color:#e8eef3;font-weight:600}
.theme-switch a.on{background:#fff;color:#14202b;border-color:#fff}
html[lang=ar] h1,html[lang=ar] h2,html[lang=ar] h3,html[lang=ar] .logo{font-family:"Noto Sans Arabic",sans-serif!important;font-style:normal}

/* ================= KLASİK ================= */
[data-theme=klasik]{--bg:#faf7f2;--card:#fffdf9;--line:#e6dccb;--ink:#2a2420;--muted:#7a6f63;--gold:#b08d57;--radius:4px;--shadow:0 24px 50px -30px rgba(60,40,20,.35)}
[data-theme=klasik] body{font-family:"Lato",system-ui,sans-serif;background:var(--bg)}
[data-theme=klasik] h1,[data-theme=klasik] h2,[data-theme=klasik] h3,[data-theme=klasik] .logo,[data-theme=klasik] .fact b,[data-theme=klasik] .stay b,[data-theme=klasik] .flow-item .n{font-family:"Cormorant Garamond",Georgia,serif;letter-spacing:0}
[data-theme=klasik] h1{font-size:clamp(42px,6.2vw,78px);font-weight:500;line-height:1.04}
[data-theme=klasik] h1 em{font-style:italic;background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--brand)}
[data-theme=klasik] h2{font-size:clamp(34px,4.2vw,52px);font-weight:500}
[data-theme=klasik] h2::after{content:"";display:block;width:56px;height:1px;background:var(--gold);margin:18px auto 0}
[data-theme=klasik] .book-side h2::after,[data-theme=klasik] .intl h2::after{margin-inline:0}
[data-theme=klasik] h3{font-weight:600}
[data-theme=klasik] .btn{border-radius:2px;text-transform:uppercase;letter-spacing:.12em;font-size:12.5px;padding:15px 26px}
[data-theme=klasik] .btn-sm{padding:11px 18px}
[data-theme=klasik] .btn-primary{background:var(--brand);box-shadow:none}
[data-theme=klasik] .btn-ghost{background:transparent;border:1px solid var(--ink)}
[data-theme=klasik] .btn-dark{background:transparent;color:var(--ink);border:1px solid var(--gold)}
[data-theme=klasik] .btn-accent{background:var(--gold);color:#fff}
[data-theme=klasik] header.nav{background:var(--bg)}
[data-theme=klasik] .nav-in{height:84px}
[data-theme=klasik] .logo{font-size:26px;font-weight:600}
[data-theme=klasik] .logo small{font-family:"Lato",sans-serif;text-transform:uppercase;letter-spacing:.18em;font-size:9.5px;margin-top:0}
[data-theme=klasik] .logo-mark{border-radius:50%;background:transparent;border:1px solid var(--gold);color:var(--gold)}
[data-theme=klasik] .menu{text-transform:uppercase;letter-spacing:.14em;font-size:12px;font-weight:700}

[data-theme=klasik] .why{background:var(--card)}

/* ================= PREMIUM (koyu) ================= */
[data-theme=premium]{--bg:#0a0d12;--card:#121821;--line:#243041;--ink:#eef2f6;--muted:#93a1b0;--radius:16px;--shadow:0 30px 60px -30px rgba(0,0,0,.8)}

[data-theme=premium] h1 em{background:linear-gradient(90deg,var(--accent),color-mix(in oklab,var(--accent) 35%,#fff));-webkit-background-clip:text;background-clip:text;color:transparent}
[data-theme=premium] h2{font-size:clamp(32px,4.4vw,56px);font-weight:800;letter-spacing:-.04em}

[data-theme=premium] .burger{border-color:var(--line)}
[data-theme=premium] .logo-mark{background:linear-gradient(135deg,var(--accent),var(--brand));color:#0a0d12;border-radius:10px}

[data-theme=premium] .lang{background:transparent;border-color:var(--line)}
[data-theme=premium] .lang button.on{background:var(--accent);color:#111}
[data-theme=premium] .btn{border-radius:12px}
[data-theme=premium] .btn-primary,[data-theme=premium] .btn-primary:hover{background:linear-gradient(135deg,var(--accent),color-mix(in oklab,var(--accent) 50%,var(--brand)));color:#0a0d12;box-shadow:0 12px 40px -12px var(--accent)}
[data-theme=premium] .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
[data-theme=premium] .btn-dark{background:#ffffff10;border:1px solid #ffffff26;color:#fff}
[data-theme=premium] .btn-accent{background:var(--accent);color:#0a0d12}
[data-theme=premium] .hero{background:radial-gradient(900px 560px at 85% 10%,color-mix(in oklab,var(--brand) 60%,transparent),transparent 62%),radial-gradient(700px 460px at 0% 100%,color-mix(in oklab,var(--accent) 22%,transparent),transparent 60%),var(--bg)}
[data-theme=premium] .hero-in{padding:110px 20px 120px}
[data-theme=premium] .deco-tooth{color:var(--accent);opacity:.05}
[data-theme=premium] .pill{background:#ffffff0d;border-color:#ffffff1f;color:var(--muted)}
[data-theme=premium] .istrip button{background:#ffffff0a;border-color:#ffffff1f;color:var(--muted)}
[data-theme=premium] .istrip button:hover{border-color:var(--accent);color:var(--accent)}
[data-theme=premium] .fact{background:#ffffff08;border:1px solid #ffffff14;border-radius:14px;padding:14px 18px}
[data-theme=premium] .fact b{color:var(--accent)}
[data-theme=premium] .hero-card{background:rgba(255,255,255,.06);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid #ffffff22;color:var(--ink)}
[data-theme=premium] .qday{background:#ffffff0d}
[data-theme=premium] .qslots button{border-color:#ffffff22}
[data-theme=premium] .qslots button:hover,[data-theme=premium] .qslots button.on{background:color-mix(in oklab,var(--accent) 22%,transparent);border-color:var(--accent);color:#fff}
[data-theme=premium] .float-tag{background:var(--card);color:var(--ink);border:1px solid var(--line)}
[data-theme=premium] .eyebrow{color:var(--accent)}
[data-theme=premium] .grid-t{counter-reset:t}

[data-theme=premium] .tcard::before{content:"0" counter(t);position:absolute;inset-inline-end:22px;top:16px;font-size:46px;font-weight:800;color:#ffffff0c;letter-spacing:-.04em}
[data-theme=premium] .tcard:hover{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
[data-theme=premium] .tic{background:color-mix(in oklab,var(--accent) 14%,transparent);color:var(--accent)}
[data-theme=premium] .tcard .lnk{color:var(--accent)}
[data-theme=premium] .why{background:#0d1118;border-color:var(--line)}
[data-theme=premium] .why-item{background:var(--card);border:1px solid var(--line)}

[data-theme=premium] .panel{background:var(--card);border-color:var(--line);color:var(--ink)}
[data-theme=premium] .intl .panel{color:var(--ink)}
[data-theme=premium] .steps{border-color:var(--line)}
[data-theme=premium] .steps div.on{color:var(--accent)}

[data-theme=premium] .steps div.done{color:var(--ink)}
[data-theme=premium] .chip,[data-theme=premium] .day,[data-theme=premium] .slot{background:#ffffff08;border-color:var(--line);color:var(--ink)}
[data-theme=premium] .chip.on,[data-theme=premium] .day.on,[data-theme=premium] .slot.on{background:var(--accent);border-color:var(--accent);color:#0a0d12}
[data-theme=premium] .day.on small,[data-theme=premium] .day.on em{color:#0a0d12b3}
[data-theme=premium] .day:disabled,[data-theme=premium] .slot:disabled{background:#ffffff04;color:#4b5868}
[data-theme=premium] .field input,[data-theme=premium] .field select,[data-theme=premium] .field textarea{background:#0d1118;border-color:var(--line);color:var(--ink)}
[data-theme=premium] .pfoot{background:#0d1118;border-color:var(--line)}
[data-theme=premium] .summary b{color:#fff}
[data-theme=premium] .rcpt{background:#0d1118}
[data-theme=premium] .book-side li .ck{background:var(--accent);color:#0a0d12}
[data-theme=premium] .intl{background:linear-gradient(160deg,#0d1118,color-mix(in oklab,var(--brand) 40%,#0a0d12))}
[data-theme=premium] .flow-item .n,[data-theme=premium] .stay b{color:var(--accent)}
[data-theme=premium] .flow-item .n{background:color-mix(in oklab,var(--accent) 18%,transparent);border:1px solid var(--accent)}
[data-theme=premium] .cinfo{background:var(--card);border-color:var(--line)}

  [data-theme=klasik] .hero-card{grid-template-columns:1fr;padding:22px}

}

</head>
<body>

<div class="demo-bar" data-i18n-html="demoBar"></div>
<div class="theme-switch"><span>Tasarım seçin:</span><a href="./" class="on">1 · Modern ⭐</a><a href="klasik/" class="">2 · Klasik</a><a href="premium/" class="">3 · Premium</a></div>

<header class="nav">
  <div class="wrap nav-in">
    <a href="#top" class="logo">
      <span class="logo-mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3c-2.2 0-4 1.8-4 4.4 0 2.6 1.2 4 1.6 6.4.4 2.4.6 7.2 2.4 7.2 1.8 0 1.6-5 3-5h4c1.4 0 1.2 5 3 5s2-4.8 2.4-7.2C19.8 11.4 21 10 21 7.4 21 4.8 19.2 3 17 3c-2 0-3 1.2-5 1.2S9 3 7 3z"/></svg></span>
      <span><span data-c="name"></span><small data-i18n="tagline"></small></span>
    </a>

      <div class="lang" id="lang">

      </div>
      <a href="#randevu" class="btn btn-primary btn-sm" data-i18n="ctaBook"></a>
      <button class="burger" id="burger" aria-label="Menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
  </div>
</header>

<main id="top">
<!-- HERO -->
<div class="hero">
  <svg class="deco-tooth" viewBox="0 0 24 24" fill="currentColor"><path d="M7 3c-2.2 0-4 1.8-4 4.4 0 2.6 1.2 4 1.6 6.4.4 2.4.6 7.2 2.4 7.2 1.8 0 1.6-5 3-5h4c1.4 0 1.2 5 3 5s2-4.8 2.4-7.2C19.8 11.4 21 10 21 7.4 21 4.8 19.2 3 17 3c-2 0-3 1.2-5 1.2S9 3 7 3z"/></svg>
  <div class="wrap hero-in">
    <div>
      <span class="pill"><i></i><span data-i18n="pill"></span></span>
      <h1 data-i18n-html="heroTitle"></h1>
      <p class="lead" data-i18n="heroLead"></p>
      <div class="hero-cta">
        <a href="#randevu" class="btn btn-primary"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg><span data-i18n="ctaBook"></span></a>
        <a href="#international" class="btn btn-dark">🌍 <span data-i18n="ctaIntl"></span></a>
      </div>
      <div class="istrip">

        <div class="fact"><b data-i18n="factB3"></b><span data-i18n="fact3"></span></div>
      </div>
    </div>
    <div class="hero-card">
      <h3 data-i18n="quickTitle"></h3>
      <p class="s" data-i18n="quickSub"></p>
      <div class="qday"><span id="qDayLabel"></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg></div>
      <div class="qslots" id="qSlots"></div>
      <a href="#randevu" class="btn btn-primary" style="width:100%" id="qGo" data-i18n="quickGo"></a>

    </div>
  </div>
</div>

      </div>
    </div>
  </div>

      <div class="eyebrow" data-i18n="intlEyebrow"></div>

      <p class="sub" data-i18n="intlSub"></p>

<section class="why">

/* ---------- state ---------- */
let lang = 'tr';
(function(){
  let stored=null; try{ stored=localStorage.getItem('lang'); }catch(e){}
  const qp=new URLSearchParams(location.search).get('lang');
  if(T[qp]) lang=qp;
  else if(T[stored]) lang=stored;
  else { const nav=(navigator.languages||[navigator.language||'tr']).map(l=>String(l).slice(0,2).toLowerCase()); const hit=nav.find(l=>T[l]); if(hit) lang=hit; }
})();
const state={step:0,treat:null,date:null,slot:null};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const t=k=>{const f=FOCUS[CLINIC.focus]; const v=(f&&f[lang]&&f[lang][k]!==undefined)?f[lang][k]:T[lang][k]; return typeof v==='string'? v.replace(/\{name\}/g,CLINIC.name).replace(/\{area\}/g,CLINIC.area||'Bağcılar').replace(/\{fullName\}/g,CLINIC.fullName):v;};
const treatName=id=>TREAT[id][lang][0];
const treatList=()=>[...CLINIC.featured,'muayene'];
const pad=n=>String(n).padStart(2,'0');
const telHref=p=>'tel:+90'+p.replace(/\D/g,'').replace(/^0/,'');
const STORE='demo-bookings-'+CLINIC.slug;
const loadB=()=>{try{return JSON.parse(localStorage.getItem(STORE)||'[]')}catch(e){return[]}};
const saveB=b=>{try{localStorage.setItem(STORE,JSON.stringify(b))}catch(e){}};

/* ---------- schedule ---------- */
function dayEnd(d){const o=CLINIC.open,w=d.getDay(); if(w===0) return o.sunday?(o.sunEnd||o.end):null; if(w===6) return o.satEnd??o.end; return o.end;}
function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h);}
function slotsFor(d){
  const end=dayEnd(d); if(end==null) return [];
  const out=[], now=new Date(), key=d.toDateString();
  for(let m=CLINIC.open.start*60;m<=end*60-30;m+=30){
    const hh=Math.floor(m/60),mm=m%60, label=pad(hh)+':'+pad(mm);
    const dt=new Date(d); dt.setHours(hh,mm,0,0);
    const past = dt < new Date(now.getTime()+60*60*1000);
    const taken = hash(key+label)%4===0;
    out.push({label,disabled:past||taken});
  }
  return out;
}
function nextDays(n){const a=[],d=new Date();d.setHours(0,0,0,0);for(let i=0;i<n;i++){const x=new Date(d);x.setDate(d.getDate()+i);a.push(x);}return a;}
const fmtDate=d=>`${d.getDate()} ${T[lang].months[d.getMonth()]}, ${T[lang].weekdays[d.getDay()]}`;

/* ---------- render ---------- */
function renderStatic(){
  const html=document.documentElement;
  html.lang=lang; html.dir=lang==='ar'?'rtl':'ltr';
  $$('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
  $$('[data-i18n-html]').forEach(el=>el.innerHTML=t(el.dataset.i18nHtml));
  $$('[data-i18n-ph]').forEach(el=>el.placeholder=t(el.dataset.i18nPh));
  $$('[data-c]').forEach(el=>el.textContent=CLINIC[el.dataset.c]||'');
  $$('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
  // whatsapp / call buttons
  $$('.js-wa').forEach(a=>{
    if(CLINIC.whatsapp){a.href='https://wa.me/'+CLINIC.whatsapp+'?text='+encodeURIComponent(`Merhaba ${CLINIC.name}, bilgi almak istiyorum.`);a.target='_blank';a.rel='noopener';}
    else{a.href=telHref(CLINIC.phone);a.classList.add('call');}
  });
  $$('.js-wa-ic').forEach(s=>s.innerHTML=CLINIC.whatsapp?WA_SVG:ico('chat',20));
  $$('.js-wa-label').forEach(s=>s.textContent=CLINIC.whatsapp?t('wa'):t('call'));
  if(!CLINIC.whatsapp) $('.fab').innerHTML='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>';
  // open days
  // treatments
  $('#treatGrid').innerHTML=CLINIC.featured.map(id=>`<div class="tcard"><div class="tic">${ico(TREAT[id].ic,26)}</div><h3>${TREAT[id][lang][0]}</h3><p>${TREAT[id][lang][1]}</p><a href="#randevu" class="lnk" data-treat="${id}">${t('more')} ${ico('arrow',16)}</a></div>`).join('');
  $$('[data-treat]').forEach(a=>a.onclick=()=>{state.treat=a.dataset.treat;state.step=1;renderBook();});
  $('#whyGrid').innerHTML=t('why').map(([i,h,p])=>`<div class="why-item"><div class="tic">${ico(i)}</div><h4>${h}</h4><p>${p}</p></div>`).join('');
  $('#bookPerks').innerHTML=t('perks').map(p=>`<li><span class="ck">${ico('check',14,3)}</span>${p}</li>`).join('');
  $('#flow').innerHTML=t('flow').map(([h,p],i)=>`<div class="flow-item"><span class="n">${i+1}</span><div><h4>${h}</h4><p>${p}</p></div></div>`).join('');
  $('#stays').innerHTML=t('stays').map(([id,d])=>`<div class="stay"><small>${t('stayLabel')}</small><b>${d}</b><span>${treatName(id)}</span></div>`).join('');
  const sp=$('#sendPhotos');
  if(CLINIC.whatsapp){ sp.style.display=''; sp.href='https://wa.me/'+CLINIC.whatsapp+'?text='+encodeURIComponent(`Merhaba ${CLINIC.name}, ön değerlendirme için fotoğraf/röntgen gönderiyorum. (Dil: ${lang.toUpperCase()})`); sp.innerHTML=WA_SVG+' '+t('sendPhotos'); } else sp.style.display='none';
  const ig=CLINIC.instagram; const igUrl=ig?'https://instagram.com/'+ig.replace(/^@/,''):null;
  $('#igRow').style.display=ig?'':'none'; $('#igFoot').style.display=ig?'':'none';
  if(ig){ $('#igLink').href=igUrl; $('#igLink').textContent='@'+ig.replace(/^@/,''); $('#igFoot').href=igUrl; }
  $('#intlTreat').innerHTML=treatList().map(id=>`<option value="${id}">${treatName(id)}</option>`).join('');
  // contact
  const phones=[CLINIC.phone,CLINIC.phone2].filter(Boolean);
  $('#phones').innerHTML=phones.map(p=>`<a href="${telHref(p)}">${p}</a>`).join('<br>');
  if(CLINIC.email){$('#emailLink').href='mailto:'+CLINIC.email;} else $('#emailRow').style.display='none';
  const h=CLINIC.hours, d=t('days');
  $('#hoursTbl').innerHTML=[[d[0],h.weekdays],[d[1],h.saturday],[d[2],h.sunday]].map(([a,b])=>`<tr><td>${a}</td><td class="${b?'':'closed'}">${b||t('closedL')}</td></tr>`).join('');
  $('#map').src='https://maps.google.com/maps?q='+encodeURIComponent(CLINIC.mapQuery||CLINIC.address)+'&z=16&output=embed';
  renderQuick(); renderBook();
}

function firstOpenDay(){return nextDays(14).find(d=>slotsFor(d).some(s=>!s.disabled));}
function renderQuick(){
  const d=firstOpenDay(); if(!d) return;
  $('#qDayLabel').textContent=fmtDate(d);
  const free=slotsFor(d).filter(s=>!s.disabled).slice(0,6);
  $('#qSlots').innerHTML=free.map(s=>`<button data-q="${s.label}">${s.label}</button>`).join('');
  $$('[data-q]').forEach(b=>b.onclick=()=>{$$('[data-q]').forEach(x=>x.classList.remove('on'));b.classList.add('on');state.date=d.toDateString();state.slot=b.dataset.q;});
  $('#qGo').onclick=()=>{ if(state.slot){state.step=state.treat?2:0;} renderBook(); };
}

function renderBook(){
  const body=$('#pbody'), foot=$('#pfoot');
  $$('#steps > div').forEach((el,i)=>{el.classList.toggle('on',i===state.step);el.classList.toggle('done',i<state.step);});
  foot.style.display=state.step===3?'none':'flex';
  $('#back').style.visibility=state.step===0?'hidden':'visible';
  $('#next').textContent=state.step===2?t('confirm'):t('next');
  const sum=[]; if(state.treat) sum.push(`<b>${treatName(state.treat)}</b>`); if(state.slot&&state.date) sum.push(`${fmtDate(new Date(state.date))} · <b>${state.slot}</b>`);
  $('#summary').innerHTML=sum.join('<br>');

  if(state.step===0){
    body.innerHTML=`<span class="lbl">${t('pickTreat')}</span><div class="chips">${treatList().map(id=>`<button class="chip ${state.treat===id?'on':''}" data-t="${id}">${treatName(id)}</button>`).join('')}</div><div class="err" id="err"></div>`;
    $$('[data-t]').forEach(b=>b.onclick=()=>{state.treat=b.dataset.t;renderBook();});
  }
  if(state.step===1){
    const days=nextDays(14);
    if(!state.date) state.date=(firstOpenDay()||days[0]).toDateString();
    const sel=new Date(state.date), slots=slotsFor(sel);
    body.innerHTML=`<span class="lbl">${t('pickDay')}</span><div class="days">${days.map(d=>{const has=slotsFor(d).some(s=>!s.disabled);return `<button class="day ${d.toDateString()===state.date?'on':''}" data-d="${d.toDateString()}" ${has?'':'disabled'}><small>${T[lang].weekdays[d.getDay()]}</small><b>${d.getDate()}</b><em>${has?T[lang].months[d.getMonth()]:(dayEnd(d)==null?t('closed'):t('full'))}</em></button>`}).join('')}</div>
      <span class="lbl" style="margin-top:18px">${t('pickSlot')}</span><div class="slots">${slots.map(s=>`<button class="slot ${state.slot===s.label?'on':''}" data-s="${s.label}" ${s.disabled?'disabled':''}>${s.label}</button>`).join('')}</div><div class="err" id="err"></div>`;
    $$('[data-d]').forEach(b=>b.onclick=()=>{state.date=b.dataset.d;state.slot=null;renderBook();});
    $$('[data-s]').forEach(b=>b.onclick=()=>{state.slot=b.dataset.s;renderBook();});
  }
  if(state.step===2){
    const f=state.form||{};
    body.innerHTML=`<div class="field"><input id="fName" placeholder="${t('phName')}" value="${esc(f.name||'')}" autocomplete="name"></div>
      <div class="field"><input id="fPhone" type="tel" placeholder="${t('phPhone')}" value="${esc(f.phone||'')}" autocomplete="tel"></div>
      <div class="field"><textarea id="fNote" rows="3" placeholder="${t('phNote')}">${esc(f.note||'')}</textarea></div>
      <label class="consent"><input type="checkbox" id="fOk" ${f.ok?'checked':''}><span>${t('consent')}</span></label><div class="err" id="err"></div>`;
  }
  if(state.step===3){
    const b=state.last, wa=CLINIC.whatsapp;
    body.innerHTML=`<div class="success"><div class="big">${ico('check',34,2.6)}</div><h3>${t('okTitle')}</h3><p>${wa?t('okSubWa'):t('okSub')}</p>
      <div class="rcpt"><div><span>${t('sumTreat')}</span><b>${treatName(b.treat)}</b></div><div><span>${t('sumWhen')}</span><b>${fmtDate(new Date(b.date))} · ${b.slot}</b></div><div><span>${t('sumName')}</span><b>${esc(b.name)}</b></div><div><span>${t('sumPhone')}</span><b>${esc(b.phone)}</b></div></div>
      ${wa?`<a class="btn btn-primary" style="background:#25D366;width:100%" target="_blank" rel="noopener" href="${waBooking(b)}">${WA_SVG} ${t('sendWa')}</a>`:''}
      <button class="btn btn-ghost" style="width:100%;margin-top:10px" id="again">${t('newBook')}</button></div>`;
    $('#again').onclick=()=>{Object.assign(state,{step:0,treat:null,date:null,slot:null,form:null});renderBook();};
  }
  bindKvkk();
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function waBooking(b){
  const d=new Date(b.date);
  const msg=`Merhaba ${CLINIC.name}, web sitenizden randevu talebi:\n• Tedavi: ${TREAT[b.treat].tr[0]}\n• Tarih: ${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()} ${b.slot}\n• Ad Soyad: ${b.name}\n• Telefon: ${b.phone}`+(b.note?`\n• Not: ${b.note}`:'')+(lang!=='tr'?`\n• Dil: ${lang.toUpperCase()}`:'');
  return 'https://wa.me/'+CLINIC.whatsapp+'?text='+encodeURIComponent(msg);
}

$('#next').onclick=()=>{
  const err=m=>{const e=$('#err'); if(e) e.textContent=m;};
  if(state.step===0){ if(!state.treat) return err(t('errTreat')); state.step=1; }
  else if(state.step===1){ if(!state.slot) return err(t('errSlot')); state.step=2; }
  else if(state.step===2){
    const f={name:$('#fName').value.trim(),phone:$('#fPhone').value.trim(),note:$('#fNote').value.trim(),ok:$('#fOk').checked};
    state.form=f;
    if(f.name.length<3||f.phone.replace(/\D/g,'').length<10||!f.ok) return err(t('errForm'));
    const b={id:Date.now(),treat:state.treat,date:state.date,slot:state.slot,name:f.name,phone:f.phone,note:f.note,lang,status:'pending'};
    const all=loadB(); all.unshift(b); saveB(all); state.last=b; state.step=3;
  }
  renderBook(); $('#randevu').scrollIntoView({behavior:'smooth'});
};
$('#back').onclick=()=>{ if(state.step===2){ state.form={name:$('#fName').value,phone:$('#fPhone').value,note:$('#fNote').value,ok:$('#fOk').checked}; } state.step=Math.max(0,state.step-1); renderBook(); };

$('#intlForm').onsubmit=e=>{
  e.preventDefault(); const fd=Object.fromEntries(new FormData(e.target));
  if(CLINIC.whatsapp){
    const msg=`Merhaba ${CLINIC.name}, yurt dışından ön değerlendirme talebi:\n• Ad: ${fd.name}\n• Ülke: ${fd.country}\n• WhatsApp: ${fd.phone}\n• Tedavi: ${TREAT[fd.treatment].tr[0]}\n• Mesaj: ${fd.msg||'-'}\n• Dil: ${lang.toUpperCase()}`;
    window.open('https://wa.me/'+CLINIC.whatsapp+'?text='+encodeURIComponent(msg),'_blank','noopener');
  }
  $('#intlMsg').textContent=t('consultOk'); e.target.reset();
};

/* panel + kvkk */
function openModal(id){$(id).classList.add('on');}
$$('.js-close').forEach(b=>b.onclick=()=>b.closest('.modal').classList.remove('on'));
$$('.modal').forEach(m=>m.onclick=e=>{if(e.target===m)m.classList.remove('on');});
function bindKvkk(){$$('.js-kvkk').forEach(a=>a.onclick=e=>{e.preventDefault();openModal('#kvkkModal');});}
$('#kvkkLink').onclick=e=>{e.preventDefault();openModal('#kvkkModal');};
function renderPanel(){
  const all=loadB();
  $('#panelBody').innerHTML=!all.length?`<div class="empty">${t('pEmpty')}</div>`:
   `<table class="bk"><tr><th>${t('pWhen')}</th><th>${t('pPatient')}</th><th>${t('pTreat')}</th><th>${t('pStatus')}</th><th></th></tr>${all.map(b=>`<tr><td><b>${fmtDate(new Date(b.date))}</b><br>${b.slot}</td><td>${esc(b.name)}<br><a href="${telHref(b.phone)}" style="color:var(--brand)">${esc(b.phone)}</a>${b.note?`<br><small style="color:var(--muted)">${esc(b.note)}</small>`:''}</td><td>${treatName(b.treat)}<br><small style="color:var(--muted)">${b.lang.toUpperCase()}</small></td><td><span class="badge ${b.status==='ok'?'ok':''}">${b.status==='ok'?t('pOk'):t('pPending')}</span></td><td>${b.status==='ok'?'':`<button class="btn btn-primary btn-sm" data-ok="${b.id}">${t('pApprove')}</button>`}</td></tr>`).join('')}</table>`;
  $$('[data-ok]').forEach(btn=>btn.onclick=()=>{const a=loadB();const x=a.find(y=>String(y.id)===btn.dataset.ok);if(x)x.status='ok';saveB(a);renderPanel();});
}
$('#panelLink').onclick=e=>{e.preventDefault();renderPanel();openModal('#panelModal');};
if(location.hash==='#panel'){renderPanel();openModal('#panelModal');}

$$('#lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem('lang',lang)}catch(e){};renderStatic();});
$$('[data-go]').forEach(b=>b.onclick=()=>{lang=b.dataset.go;try{localStorage.setItem('lang',lang)}catch(e){};renderStatic();$('#international').scrollIntoView({behavior:'smooth'});});
$('#burger').onclick=()=>$('#menu').classList.toggle('open');
$$('#menu a').forEach(a=>a.onclick=()=>$('#menu').classList.remove('open'));
renderStatic();
</script>
</body>
