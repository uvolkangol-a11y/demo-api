services:
  postgres:
    image: postgres:16-alpine
    container_name: demo-api-postgres
    environment:
      POSTGRES_DB: demoapi
      POSTGRES_USER: demoapi
      POSTGRES_PASSWORD: demoapi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demoapi -d demoapi"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: demo-api-app
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: demoapi
      DB_USER: demoapi
      DB_PASSWORD: demoapi
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
